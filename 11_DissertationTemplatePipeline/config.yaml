cancer_code: LIHC

# ==================================================
# DYNAMIC INPUTS
# ==================================================

paths:
  counts_dir: /Users/arnavjoshi/Desktop/LIHC
  output_dir: /Users/arnavjoshi/Desktop/TemplateTesting
  sample_sheet_tsv: /Users/arnavjoshi/Desktop/LIHCOtherData/gdc_sample_sheet.2025-07-18.tsv
  clinical_tsv: /Users/arnavjoshi/Desktop/LIHCOtherData/clinical.cart.2025-07-18/clinical.tsv
  subtype_tsv: /Users/arnavjoshi/Desktop/LIHCOtherData/PANCAN_iClusterData.tsv

subtype:
  sample_id_column: samples
  subtype_value_column: Subtype_Integrative
  aggressive_subtypes:
    - iCluster:1

sample_types:
  tumor: [Tumor]
  control: [Normal]

races:
  race_1: White
  race_2: black or african american
  all_label: All

stage5:
  survival_tsv: /Users/arnavjoshi/Desktop/LIHCOtherData/LIHCSurvivalData.tsv
  sample_id_column: sample
  event_column: OS
  time_column: OS.time

# ==================================================
# STAGE EXECUTION TOGGLES
# ==================================================
run_stages:
  stage1: true
  stage2: true
  stage3: true
  stage4: true
  stage5: true

# ==================================================
# ANALYTICAL PARAMETERS
# ==================================================

stage4:
  organism: hsapiens
  enrichment_sources: [GO:BP, GO:CC, GO:MF, KEGG]
  pvalue_cutoff: 0.05
  log2fc_threshold: 1.0

stage5:
  # Survival / recurrence input (Xena-style)
  survival_tsv: /Users/arnavjoshi/Desktop/LIHCOtherData/LIHCSurvivalData.tsv

  # Column names in survival TSV
  sample_id_column: sample
  event_column: OS
  time_column: OS.time

  # ---------------- 70:30 Split ----------------
  split_run: true
  split_test_size: 0.30
  split_random_state: 12

  # ---------------- LASSO parameters ----------------
  lasso_alphas_logspace_start: -4
  lasso_alphas_logspace_stop: -1
  lasso_alphas_n: 100
  lasso_cv_folds: 5
  lasso_max_iter: 10000
  lasso_random_state: 12

  # ---------------- Cox model parameters ----------------
  cox_penalizer: 0.1
  near_zero_var_threshold: 1e-5

  # ---------------- K-Fold LASSO–Cox ----------------
  kfold_run: true
  kfold_splits: 10
  kfold_shuffle: true
  kfold_random_state: 12
  stable_feature_min_folds: 2

  # ---------------- Output options ----------------
  save_overall_km: true
